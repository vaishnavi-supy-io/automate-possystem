# Final output column order (must list every non-dropped target column)
output_column_order:
  - "Sales Date *"
  - "POS Item ID *"
  - "POS Item Name"
  - "Sold QTY *"
  - "Total Discount Value"
  - "Total sales excl. tax *"
  - "Total sales incl. tax *"
  - "Order ID"
  - "Sales Type Code"

# Output date format — e.g. "01-May-2026"
output_date_format: "%d-%b-%Y"

# -------------------------------------------------------
# EMAIL FETCH (Stage 0)
# Inboxes to check for incoming FLARE Talabat reports.
# user_env / password_env: names of env vars holding credentials.
# An email matches if From contains sender_pattern OR
# Subject contains subject_pattern (both case-insensitive).
# The first unseen matching email with an .xlsx attachment is used.
# -------------------------------------------------------
email_fetch:
  inboxes:
    - user_env: TALABAT_INBOX_USER_1       # customercare@supy.io
      password_env: TALABAT_INBOX_PASSWORD_1
    - user_env: GMAIL_USER                 # vaishnavi@supy.io (reuses existing credentials)
      password_env: GMAIL_APP_PASSWORD
  search:
    sender_pattern: "flare"
    subject_pattern: "talabat"
    attachment_ext: ".xlsx"
