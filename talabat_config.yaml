# ============================================================
# Talabat UAE Settlement Report — Supy POS Format Configuration
# ============================================================
# Edit this file to update column mapping or output format
# WITHOUT touching any Python code.

# -------------------------------------------------------
# FILE STRUCTURE
# Talabat exports come in two layouts we've seen so far:
#   - Side-by-side: cols 1-11 are a summary/compensation/cancellation
#     table, followed by the order detail data
#   - Detail-only: the detail data starts right after a single blank column
#
# Rather than assume a fixed offset, the ingest step locates the detail
# section by scanning the header row for detail_anchor_column and starting
# from there — this works for either layout.
#
# detail_header_row: 0-indexed row that contains column names
#   (Row 3 in Excel = index 2 in Python)
# detail_anchor_column: header string marking the detail section's first column
# -------------------------------------------------------
file:
  sheet_name: "Detailed Report"
  detail_header_row: 2
  detail_anchor_column: "Restaurant Id"

# -------------------------------------------------------
# ROW FILTER
# Only rows whose Status matches keep_status are included.
# "Charged Cancelled" orders (5 in the sample) are excluded.
# -------------------------------------------------------
filter:
  status_column: "Status"
  keep_status:
    - "Successful"

# -------------------------------------------------------
# COLUMN MAPPING
# raw    : exact header string from the Talabat .xlsx
# target : output header for the final Supy .xlsx
# dtype  : "str" | "int" | "float" | "date"
# drop   : true → column exists in raw but is excluded
# inject : "empty"      → column not in raw; write ""
#          "constant_1" → column not in raw; write integer 1
# -------------------------------------------------------
columns:
  # --- Mapped columns ---
  - raw: "Order Id"
    target: "Order ID"
    dtype: str

  - raw: "Date / Time"
    target: "Sales Date *"
    dtype: date

  - raw: "Payment Method"
    target: "Sales Type Code"
    dtype: str

  - raw: "Total Sale"
    target: "Total sales incl. tax *"
    dtype: float

  # Total sales excl. tax = Total Sale / 1.05  (UAE 5% VAT inclusive pricing)
  # Derived in the transform; the raw SubTotal column is dropped below.

  # Injected/derived columns
  - raw: null
    target: "Total sales excl. tax *"
    dtype: float
    inject: vat_excl_from_incl    # computed as Total sales incl. tax * / 1.05

  - raw: "GEM Discount"
    target: "Total Discount Value"
    dtype: float

  # --- Injected columns (not in raw file) ---
  - raw: null
    target: "POS Item ID *"
    dtype: str
    inject: empty

  - raw: null
    target: "POS Item Name"
    dtype: str
    inject: empty

  - raw: null
    target: "Sold QTY *"
    dtype: int
    inject: constant_1

  # Status is used for filtering but excluded from output
  - raw: "Status"
    target: null
    drop: true

  # --- Dropped columns (present in raw, excluded from output) ---
  - raw: "Restaurant Id"
    target: null
    drop: true

  - raw: "Restaurant"
    target: null
    drop: true

  - raw: "Branch Id"
    target: null
    drop: true

  - raw: "Branch"
    target: null
    drop: true

