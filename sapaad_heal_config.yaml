# ============================================================
# Heal Restaurant — Sapaad POS
# ============================================================
# Same portal as BMD (pos.sapaad.com), so the scraping logic, selectors and
# column mapping are inherited wholesale from sapapad_config.yaml. Only the
# tenant identity and credentials differ.
#
#     python sapapad_automation.py --config sapaad_heal_config.yaml --per-branch
#
# tenant.slug keeps this account's session under state/heal/. Sharing a
# storage_state between Sapaad accounts would log one out when the other runs.
#
# Branches are NOT listed here — discover_locations() reads them straight off
# the portal's location dropdown at run time, so --per-branch covers whatever
# this account exposes without anyone maintaining a list.
# ============================================================

tenant:
  slug: "heal"
  name: "Heal Restaurant"

auth:
  username_env: SAPAAD_HEAL_RESTAURANT_USERNAME
  password_env: SAPAAD_HEAL_RESTAURANT_PASSWORD
  # Sapaad's login may also ask for a company/tenant field. These accounts were
  # supplied as email + password only, so it is left unset until a run proves
  # otherwise.
  company_env: SAPAAD_HEAL_RESTAURANT_COMPANY

# ============================================================
# Sapapad Automation — Configuration
# ============================================================

portal:
  login_url: "https://pos.sapaad.com/"
  portal_url: "https://pos.sapaad.com/dashboard"
  report_url: "https://pos.sapaad.com/reports/top_grossing_items?order_by=totalamount&sort_by=DESC"
  # Element present only when logged in — used to validate cached session
  authenticated_element: ".LoginDetRight"

# -------------------------------------------------------
# LOGIN FIELD SELECTORS
# -------------------------------------------------------
selectors:
  username_field: "#user_email"
  company_field: ""
  password_field: "#user_password"
  login_button: "button.mt-5"
  login_error: ""

# -------------------------------------------------------
# NAVIGATION CHAIN
#
# Action types:
#   click            — wait for selector, click it, optionally wait for next el
#   wait_seconds     — sleep N seconds (for async ops like export queue)
#   accept_modal     — click an OK button inside an HTML modal
#   goto_url         — navigate to a URL
#   download_latest  — download from the Saved Reports row whose title matches
#                      this report's label (and branch, in --per-branch mode),
#                      falling back to the bare `click` selector for the main
#                      report only. Polls up to poll_attempts times, waiting
#                      poll_interval_s between attempts, if the row is not
#                      generated yet.
# -------------------------------------------------------
# -------------------------------------------------------
# DATE FILTER
# The dashboard's filter offers Today / Yesterday / This week / This Month /
# Last Month / Custom. Backfills use Custom, whose two text inputs accept
# typed values.
#
# ⚠️  A SAPAAD BUSINESS DAY RUNS 04:00 -> 04:00, NOT MIDNIGHT. Selecting
#     "Today" on 3 Sep populates from_date "03/09/2026 04:00:00" and to_date
#     "04/09/2026 04:00:00" — so late-night trade books to the previous day.
#     A backfill that used midnight boundaries would silently disagree with
#     the portal's own totals. The time component is READ BACK from whatever
#     the portal has already put in the field rather than hardcoded, so this
#     stays correct if the client's day boundary is ever changed.
# -------------------------------------------------------
date_filter:
  toggle: ".dateFilterToggle"
  option_template: "a.customDateSelection:has-text('{label}')"
  yesterday_label: "Yesterday"
  custom_label: "Custom"
  # Stable element ids, preferred over matching on visible text.
  yesterday_option: "#dr_yesterday"
  custom_option: "#dr_custom"
  from_field: "#from_date"
  to_field: "#to_date"
  apply_button: ".applyFilterButton"
  # Format of the two inputs, confirmed 2026-09-03 from their live values.
  input_format: "%d/%m/%Y %H:%M:%S"
  # Fallback only, if the field is empty and no time can be read back.
  default_day_start: "04:00:00"

navigation:
  # (The old separate "Open date filter" click was removed 2026-09-03:
  #  select_date opens the dropdown itself, and clicking the toggle twice
  #  TOGGLED IT SHUT — the options were then present but hidden, and the run
  #  failed with "44 x locator resolved to hidden".)

  # Step 2 — choose the report date.
  # With no --date this clicks the Yesterday preset, exactly as before (the
  # daily job keeps its proven click path). With --date it switches the filter
  # to Custom and types the range. See select_date in sapapad_automation.py.
  - step: "Select report date"
    action: select_date

  # Step 3 — click the Excel/CSV export icon
  - step: "Click Export icon"
    action: click
    click: "a:has(i.fa-file-excel-o)"
    wait: "button.closeCsv"

  # Step 4 — dismiss the "data is being exported" HTML modal
  - step: "Dismiss export modal"
    action: accept_modal
    modal_ok_selector: "button.closeCsv"
    wait: null

  # Step 5 — wait for the export job to complete on the server (~20-30s)
  - step: "Wait for export to process"
    action: wait_seconds
    seconds: 25

  # Step 6 — navigate to Saved Reports
  - step: "Go to Saved Reports"
    action: goto_url
    url: "https://pos.sapaad.com/dashboard/saved_reports"
    wait: null

  # Step 7 — download the most recently generated CSV
  # polls the page (refreshes) until the link appears, up to poll_attempts times
  - step: "Download CSV"
    action: download_latest
    click: "a:has-text('Download csv')"
    poll_attempts: 6
    poll_interval_s: 15
    wait: null

# -------------------------------------------------------
# HEADER DETECTION
# The CSV from Sapaad has a clean header row — no metadata
# rows to scan past. Leave empty to use row 0 as header.
# -------------------------------------------------------
header_sentinel: ""

# -------------------------------------------------------
# AGGREGATE ROW DETECTION
# No total/subtotal rows in Sapaad CSV. Leave empty to skip
# numeric-ID filtering. Rows where Item Name is null are
# still dropped in the transform.
# -------------------------------------------------------
id_column: ""

# -------------------------------------------------------
# ITEM CODE MAPPING
# Item Code column is always empty in Sapaad CSV.
# Join on Item Name instead.
# -------------------------------------------------------
item_code_mapping:
  file: "mappings/sapaad_heal_item_codes.csv"   # ⚠️ NOT YET SUPPLIED — needs this client's Supy item master
  raw_key: "Item Name"        # column in Sapapad CSV — primary join key
  ref_key: "item_name"        # matching column in mapping file
  raw_category_key: "Category"    # used to disambiguate duplicate item names
  ref_category_key: "category_name"
  target_col: "item_id"       # column in mapping file with the Supy item ID
  output_col: "POS Item ID *"

# -------------------------------------------------------
# COLUMN MAPPING
# -------------------------------------------------------
columns:
  - raw: "Item Name"
    target: "POS Item Name"
    dtype: str

  - raw: "Total Sold"
    target: "Sold QTY *"
    dtype: int

  - raw: "Total Amount Excluding Tax"
    target: "Total sales excl. tax *"
    dtype: float

  - raw: "Total Amount"
    target: "Total sales incl. tax *"
    dtype: float

  # Injected — not in raw CSV
  - raw: null
    target: "Sales Date *"
    dtype: date
    inject: date_yesterday         # yesterday's date, formatted per output_date_format

  - raw: null
    target: "Total Discount Value"
    dtype: float
    inject: empty

  - raw: null
    target: "Order ID"
    dtype: str
    inject: empty

  - raw: null
    target: "Sales Type Code"
    dtype: str
    inject: empty

  - raw: null
    target: "Parent Item ID"
    dtype: str
    inject: empty

  # Drop — present in raw but excluded from output
  - raw: "Category"
    target: null
    drop: true

  - raw: "Item Code"
    target: null
    drop: true

output_column_order:
  - "Sales Date *"
  - "POS Item ID *"
  - "POS Item Name"
  - "Sold QTY *"
  - "Total Discount Value"
  - "Total sales excl. tax *"
  - "Total sales incl. tax *"
  - "Order ID"
  - "Sales Type Code"
  - "Parent Item ID"

output_date_format: "%d-%b-%Y"

# -------------------------------------------------------
# PAID MODIFIERS — Marketing → Top Paid Modifiers
#
# Fetched as a second report in the same run, then APPENDED beneath the last
# grossing-item row of the same sheet, so Supy still ingests one file per
# branch per day. Remove this block (or pass --no-modifiers) to go back to
# grossing items alone.
# -------------------------------------------------------
modifiers:
  enabled: true

  # ⚠️  INFERRED — CONFIRM ON THE FIRST --debug RUN.
  #     Sapaad report URLs follow /reports/<report_name> and the grossing
  #     report is /reports/top_grossing_items, so this is the expected path for
  #     the "Top Paid Modifiers" card (the one carrying the NEW banner) on the
  #     Marketing page. Open that card's corner button in a headed run and
  #     paste the real URL here if it differs.
  report_url: "https://pos.sapaad.com/reports/top_paid_modifiers?order_by=totalamount&sort_by=DESC"

  # Saved Reports titles each row "{label} for {branch}". This must match the
  # portal's wording exactly: it is what separates this export from the
  # grossing export, which is sitting on the same page by the time we get here.
  saved_report_label: "Top Paid Modifiers"

  # Keeps the two downloads apart in downloads/.
  file_tag: "modifiers_raw"

  # Sapaad reports paid modifiers at GROSS only, so excl. tax is derived:
  #     excl = incl / 1.05          (UAE VAT, 5%)
  # If the export does turn out to carry an excl-tax column, name it under
  # source_columns.excl below and it is used verbatim instead — a value the
  # source states is never re-derived from its own gross.
  tax_divisor: 1.05

  # Candidate headers, tried in order, case- and space-insensitive. Several are
  # listed per field because this was specced from the written SOP rather than
  # from a captured file. A run matching none of them fails with the CSV's real
  # headers in the error message — which is what you need to trim this down.
  source_columns:
    name: ["Modifier Name", "Modifier", "Item Name", "Name"]
    qty:  ["Total Sold", "Total Qty", "Quantity", "Qty", "Sold"]
    incl: ["Total Amount", "Total Amount Including Tax", "Total Sales", "Amount"]
    excl: ["Total Amount Excluding Tax"]

  # Same chain as the grossing report: pick the date, export, dismiss the
  # modal, wait for the server-side job, then collect it from Saved Reports.
  navigation:
    - step: "Select report date"
      action: select_date

    - step: "Click Export icon"
      action: click
      click: "a:has(i.fa-file-excel-o)"
      wait: "button.closeCsv"

    - step: "Dismiss export modal"
      action: accept_modal
      modal_ok_selector: "button.closeCsv"
      wait: null

    - step: "Wait for export to process"
      action: wait_seconds
      seconds: 25

    - step: "Go to Saved Reports"
      action: goto_url
      url: "https://pos.sapaad.com/dashboard/saved_reports"
      wait: null

    - step: "Download CSV"
      action: download_latest
      click: "a:has-text('Download csv')"
      poll_attempts: 6
      poll_interval_s: 15
      wait: null
