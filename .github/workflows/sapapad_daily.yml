name: Sapapad Daily POS Report

on:
  schedule:
    # 08:00 Dubai time (UTC+4) = 04:00 UTC — runs every day
    - cron: "0 4 * * *"
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

jobs:
  run-pipeline:
    name: Download, Transform & Email Sapapad Report
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run Sapapad per-branch pipeline
        env:
          SAPAPAD_USERNAME:        ${{ secrets.SAPAPAD_USERNAME }}
          SAPAPAD_COMPANY:         ${{ secrets.SAPAPAD_COMPANY }}
          SAPAPAD_PASSWORD:        ${{ secrets.SAPAPAD_PASSWORD }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT:        ${{ secrets.REPORT_RECIPIENT }}
        run: python sapapad_automation.py --per-branch

      - name: Upload outputs as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapapad-report-${{ github.run_id }}
          path: |
            output/*.xlsx
            logs/*.jsonl
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
