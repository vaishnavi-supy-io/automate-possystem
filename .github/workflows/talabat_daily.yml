name: Talabat Daily POS Report (FLARE)

on:
  schedule:
    # 08:00 Dubai time (UTC+4) = 04:00 UTC — runs every day
    - cron: "0 4 * * *"
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

jobs:
  run-pipeline:
    name: Fetch FLARE Email, Transform & Send Talabat Report
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Talabat pipeline (attempt 1)
        id: attempt1
        continue-on-error: true
        env:
          GMAIL_USER:                ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:        ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT:          ${{ secrets.REPORT_RECIPIENT }}
          TALABAT_INBOX_USER_1:      ${{ secrets.TALABAT_INBOX_USER_1 }}
          TALABAT_INBOX_PASSWORD_1:  ${{ secrets.TALABAT_INBOX_PASSWORD_1 }}
          TALABAT_INBOX_USER_2:      ${{ secrets.TALABAT_INBOX_USER_2 }}
          TALABAT_INBOX_PASSWORD_2:  ${{ secrets.TALABAT_INBOX_PASSWORD_2 }}
        run: python talabat_automation.py --from-email

      - name: Retry — wait 2 minutes then try again
        if: steps.attempt1.outcome == 'failure'
        run: sleep 120

      - name: Run Talabat pipeline (attempt 2 — retry)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        env:
          GMAIL_USER:                ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:        ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT:          ${{ secrets.REPORT_RECIPIENT }}
          TALABAT_INBOX_USER_1:      ${{ secrets.TALABAT_INBOX_USER_1 }}
          TALABAT_INBOX_PASSWORD_1:  ${{ secrets.TALABAT_INBOX_PASSWORD_1 }}
          TALABAT_INBOX_USER_2:      ${{ secrets.TALABAT_INBOX_USER_2 }}
          TALABAT_INBOX_PASSWORD_2:  ${{ secrets.TALABAT_INBOX_PASSWORD_2 }}
        run: python talabat_automation.py --from-email

      - name: Send failure alert email
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        env:
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT:    ${{ secrets.REPORT_RECIPIENT }}
        run: |
          python - <<'EOF'
          import os, smtplib
          from email.mime.text import MIMEText

          gmail_user     = os.environ["GMAIL_USER"]
          gmail_password = os.environ["GMAIL_APP_PASSWORD"]
          recipient      = os.environ["REPORT_RECIPIENT"]
          run_id         = os.environ.get("GITHUB_RUN_ID", "unknown")
          repo           = os.environ.get("GITHUB_REPOSITORY", "")

          subject = "⚠️ Talabat POS Report FAILED — manual action needed"
          body = f"""The daily Talabat POS report pipeline failed after 2 attempts.

          GitHub Actions run: https://github.com/{repo}/actions/runs/{run_id}

          Please check the logs and re-run manually from the Actions tab,
          or run locally: python talabat_automation.py --from-email

          """

          msg = MIMEText(body)
          msg["Subject"] = subject
          msg["From"]    = gmail_user
          msg["To"]      = recipient

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(gmail_user, gmail_password)
              s.sendmail(gmail_user, recipient.split(","), msg.as_string())

          print("Failure alert sent.")
          EOF

      - name: Fail the job if both attempts failed
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: exit 1

      - name: Upload outputs as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talabat-report-${{ github.run_id }}
          path: |
            output/*.xlsx
            logs/*.jsonl
          retention-days: 30
